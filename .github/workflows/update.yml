name: Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '19,39,59 * * * *'

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log heartbeat
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: heartbeat" || echo "no changes"
          git push
